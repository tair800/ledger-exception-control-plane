[project]
name = "ledger-exception-control-plane"
version = "0.1.0"
description = "Finance-ops control plane turning unmatched settlement lines into approved, once-only ledger adjustments."
requires-python = "==3.12.*"
readme = "README.md"
license = { file = "LICENSE" }

# Runtime dependencies are added by the increment that first needs them, never in advance.
# Every entry below is required by M0.2 (local stack, health endpoints, structured logging):
#   fastapi           — the application shell and the /healthz and /readyz endpoints
#   uvicorn[standard] — the ASGI server the container actually runs
#   pydantic-settings — typed, environment-driven configuration; Pydantic v2 is already the
#                       approved convention for boundary schemas (NFR-2)
#   asyncpg           — direct async PostgreSQL client used *only* for the readiness probe.
#                       Deliberately not SQLAlchemy/Alembic: this milestone has no schema, and
#                       an ORM would be future foundation built early.
#   redis             — official client, async PING for the readiness probe only
# Versions are exact-pinned, matching the dev group, so the lockfile is the single source of
# truth and an upgrade is always a deliberate, reviewable change.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic-settings==2.15.0",
    "asyncpg==0.31.0",
    "redis==8.1.0",
    # Added at M1.1 (core reconciliation schema):
    #   sqlalchemy[asyncio] — declarative models and Core metadata. The schema is the
    #                         deliverable, and typed 2.x models let mypy check it.
    #   alembic             — the production migration path. `create_all()` is deliberately
    #                         not the schema-management mechanism; see ADR-021.
    "sqlalchemy[asyncio]==2.0.52",
    "alembic==1.19.1",
]

[dependency-groups]
dev = [
    "ruff==0.14.5",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    # httpx        — required by Starlette's TestClient
    # pytest-asyncio — to exercise the async health probes directly, including timeout bounds
    "httpx==0.28.1",
    "pytest-asyncio==1.4.0",
    "asyncpg-stubs>=0.31.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_exception_control_plane"]

# ----------------------------------------------------------------------------------
# Ruff owns both linting and formatting. One tool, two responsibilities it implements
# natively — deliberately avoiding a black + ruff pairing, which duplicates formatting.
# ----------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # prefer pathlib
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert freely; that is the point of them.
"tests/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

# ----------------------------------------------------------------------------------
# mypy, strict. NFR-1 requires the codebase to be mypy-clean in CI.
# ----------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true

# ----------------------------------------------------------------------------------
# pytest + coverage
# ----------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=ledger_exception_control_plane",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    # Integration tests need the real Compose stack and are excluded from the default run,
    # so `uv run pytest` stays deterministic and Docker-free. Run them with `-m integration`.
    "-m", "not integration",
]
markers = [
    "integration: requires the local Docker Compose stack (postgres + redis) to be running",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
# The source is declared once, here, via --cov in addopts. Declaring it again with
# source_pkgs made coverage start a second, competing measurement of an already-imported
# module and emit a `module-not-measured` warning on every run.

[tool.coverage.paths]
# The package is installed into the venv while the checkout holds it under src/.
# Without this mapping the two are treated as different files.
source = ["src/", "*/site-packages/"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
