name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first; CI on superseded commits is wasted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. This workflow publishes nothing and needs no write access.
permissions:
  contents: read

env:
  # Fail the build rather than silently resolving something the lockfile does not pin.
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        # The version is read from .python-version, so the interpreter is declared in
        # exactly one place and CI cannot drift from local development.
        run: uv python install

      - name: Install dependencies from the lockfile
        # --frozen fails if uv.lock is out of date with pyproject.toml, so a dependency
        # change that skipped the lockfile cannot reach main.
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type check (strict)
        run: uv run mypy

      - name: Run tests with coverage
        run: uv run pytest

      # Regenerates the canonical corpus and compares it with what is committed. The unit
      # suite asserts the same property, but this step fails with the offending paths listed
      # and the regeneration command in the log, which is what someone reading a red build
      # actually needs.
      - name: Verify the committed fixture corpus has not drifted
        run: uv run python -m ledger_exception_control_plane.fixtures verify

      # Same reasoning as the corpus step above, for the recorded cassettes. The unit suite
      # already compares the committed file with its builder byte for byte; this step exists
      # so a red build says "run make cassettes" instead of showing a 19KB assertion diff.
      #
      # It cannot make a provider call: capture is gated on CASSETTE_CAPTURE, which CI never
      # sets, and the builder synthesises responses rather than sending anything.
      - name: Verify the committed cassettes have not drifted
        run: uv run python -m tests.cassette_builder verify

  schema:
    name: Migrations and schema integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Narrowly scoped on purpose: a single PostgreSQL service container, no Redis and no
    # Compose. Migration correctness is the one thing unit tests genuinely cannot prove —
    # that Alembic applies from zero to head, that downgrade reverses, that the models and
    # the migration have not drifted, and that the check constraints actually reject bad
    # rows. Everything else about the schema is asserted against metadata in the `quality`
    # job, which stays Docker-free.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lecp
          POSTGRES_PASSWORD: lecp_ci_ephemeral # throwaway, lives only for this job
          POSTGRES_DB: lecp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lecp -d lecp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      LECP_POSTGRES_DSN: postgresql://lecp:lecp_ci_ephemeral@localhost:5432/lecp_test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: Verify migrations and schema integrity
        run: uv run pytest tests/test_schema_postgres.py -m integration --no-cov

      # The corpus must load against the real schema with every constraint enforced. This is
      # the plan's "committed sample loads" exit criterion for M1.3, and it reuses the
      # PostgreSQL service already running for the schema tests rather than adding one.
      - name: Verify the fixture corpus loads
        run: uv run pytest tests/test_fixtures_postgres.py -m integration --no-cov

      # Ingestion is the first path that writes rows the rest of the system will trust, and its
      # properties are all about persisted state: the receipt surviving a parse failure, a
      # rejected batch leaving nothing behind, re-delivery being arbitrated by the unique index.
      # None of that is observable without a real database, so it reuses this job's.
      - name: Verify settlement ingestion against real PostgreSQL
        run: uv run pytest tests/test_ingest_postgres.py -m integration --no-cov

      # Matching's persistence and concurrency guarantees are only observable against a real
      # database: that a match and the line state land together, that a consumed ledger entry is
      # unavailable, and that two workers racing for one entry cannot both consume it. Reuses the
      # PostgreSQL service already running for the schema tests.
      - name: Verify deterministic matching against real PostgreSQL
        run: uv run pytest tests/test_matching_postgres.py -m integration --no-cov

      # Classification's integrity rules live in the database — an exception may exist only for an
      # unmatched line, one residual yields one exception, and the vocabulary is closed — so none of
      # them is observable without one. The concurrency cases are the reason this cannot be folded
      # into the unit job: they force a real interleaving by blocking one writer on another's row
      # lock, which needs a server, not a mock. Reuses the PostgreSQL service already running above.
      - name: Verify residual classification against real PostgreSQL
        run: uv run pytest tests/test_classification_postgres.py -m integration --no-cov

      # Claim locking and operation identity. Every property here is about concurrency and
      # persisted state: that two workers cannot hold one residual, that the lock is released when
      # a worker's transaction ends, and that the identifier reaches the database before anything
      # could dispatch it. None of that is observable without a real server — the two-worker proof
      # in particular needs two genuine sessions contending for one row. Reuses the PostgreSQL
      # service already running above.
      - name: Verify claim locking and operation identity against real PostgreSQL
        run: uv run pytest tests/test_operations_postgres.py -m integration --no-cov

      # The transactional outbox and one dispatch, end to end. Every property here is about
      # persisted state and transaction boundaries: that the state change and the dispatch intent
      # commit together or not at all, that the write-ahead attempt record is committed *before*
      # the adapter is called, and that a crash between the send and the response leaves an
      # in_flight row with no outcome. None of that is observable without a real server — the
      # ordering proof in particular reads the table from a second connection mid-call.
      - name: Verify the transactional outbox and dispatch against real PostgreSQL
        run: uv run pytest tests/test_dispatch_postgres.py -m integration --no-cov

      # Bounded retry, the dead-letter queue and replay. The exit criterion here is a
      # demonstration rather than an assertion about types: an operation fails to connect until its
      # budget runs out, lands in the DLQ, and is replayed — with the applied-count read off the
      # simulated ledger rather than out of our own tables, which is what acceptance criterion 8
      # asks for. None of that is observable without a real server.
      - name: Verify bounded retry, the DLQ and replay against real PostgreSQL
        run: uv run pytest tests/test_retry_postgres.py -m integration --no-cov

      # The replay command itself, driven through `main()` with an argument vector. Acceptance
      # criterion 8 is phrased in terms of the CLI rather than the function it calls, and the
      # difference is where an operator's mistake becomes a financial one: argument handling, the
      # adapter registry, what a batch does after a bad entry, and what reaches the terminal.
      - name: Verify the replay CLI against real PostgreSQL
        run: uv run pytest tests/test_replay_cli_postgres.py -m integration --no-cov

      # The human gate. §5.1's exit criterion is that the gate *blocks the write*, and what blocks
      # it is a composite foreign key: a rejection carries a NULL treatment and the referencing
      # column is NOT NULL, so an adjustment referencing a rejection has nothing to point at. That
      # is a property of PostgreSQL, not of the application, so it is proven here.
      - name: Verify the approval gate and role separation against real PostgreSQL
        run: uv run pytest tests/test_approval_postgres.py tests/test_approval_api_postgres.py -m integration --no-cov

      # The authoritative coverage gate, and the only place it can be honest.
      #
      # The unit job cannot see `matching.service` or `classification.service` — their entire
      # contract is database behaviour and the suites that exercise them are deselected there, so
      # they measured 31% and 0% while being thoroughly tested. Gating on that measures how much of
      # the system is unit-testable rather than how well it is tested, and it drifts down every time
      # a database module lands: 89.94% at M2.3, with 495 passing tests and no untested logic.
      #
      # This runs the whole suite against the database in one process. `test_integration_stack.py`
      # is excluded because it needs the composed application container, which this job does not
      # start; nothing else is. Measured here at M2.3: 98.75%.
      - name: Coverage gate over the whole suite
        run: uv run pytest -m "" --ignore=tests/test_integration_stack.py --cov-fail-under=90

  container:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Deliberately narrow. This job builds the image and stops — it does NOT start the
    # Compose stack. Every health, readiness, timeout, correlation-id and secret-containment
    # behaviour is already proven deterministically with fakes in the `quality` job, so
    # running Docker Compose in CI would add minutes and flakiness to prove nothing new.
    # What a build-only job does catch, and unit tests cannot, is Dockerfile rot: a broken
    # base image, a lockfile the container cannot install, or a bad COPY path. That is worth
    # roughly a minute. The Compose stack is verified locally via `make up && make smoke`.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
