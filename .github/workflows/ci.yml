name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first; CI on superseded commits is wasted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. This workflow publishes nothing and needs no write access.
permissions:
  contents: read

env:
  # Fail the build rather than silently resolving something the lockfile does not pin.
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        # The version is read from .python-version, so the interpreter is declared in
        # exactly one place and CI cannot drift from local development.
        run: uv python install

      - name: Install dependencies from the lockfile
        # --frozen fails if uv.lock is out of date with pyproject.toml, so a dependency
        # change that skipped the lockfile cannot reach main.
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type check (strict)
        run: uv run mypy

      - name: Run tests with coverage
        run: uv run pytest

  container:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Deliberately narrow. This job builds the image and stops — it does NOT start the
    # Compose stack. Every health, readiness, timeout, correlation-id and secret-containment
    # behaviour is already proven deterministically with fakes in the `quality` job, so
    # running Docker Compose in CI would add minutes and flakiness to prove nothing new.
    # What a build-only job does catch, and unit tests cannot, is Dockerfile rot: a broken
    # base image, a lockfile the container cannot install, or a bad COPY path. That is worth
    # roughly a minute. The Compose stack is verified locally via `make up && make smoke`.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
